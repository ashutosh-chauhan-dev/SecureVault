name: SecureVault CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenSSL
        shell: powershell
        run: |
          choco install openssl -y --no-progress
          $opensslRoot = (Get-AppInstallLocation OpenSSL-Win)
          "OPENSSL_ROOT_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Verify OpenSSL
        shell: powershell
        run: |
          openssl version
          Write-Host "OPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR"

      - name: Configure CMake
        run: cmake -S . -B build -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR"

      - name: Build SecureVault
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure